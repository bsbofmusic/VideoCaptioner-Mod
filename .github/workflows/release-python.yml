name: Release Python Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Verify lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check videocaptioner/ tests/ scripts/

      - name: Type check release-critical code
        run: >-
          uv run pyright
          videocaptioner/cli/
          videocaptioner/core/asr/bcut.py
          videocaptioner/core/dubbing/
          videocaptioner/core/speech/providers.py
          videocaptioner/core/subtitle/style_manager.py
          videocaptioner/ui/task_factory.py

      - name: Unit tests
        run: >-
          uv run pytest
          tests/test_cli
          tests/test_dubbing
          tests/test_asr
          tests/test_style
          tests/test_packaging/test_ci_workflows.py
          tests/test_packaging/test_dependency_layers.py
          tests/test_packaging/test_windows_installer.py
          -m "not integration and not llm" -q

  package:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Build wheel and source distribution
        run: uv build

      - name: Fresh core and all-extra install smoke tests
        shell: bash
        run: |
          WHEELS=(dist/*.whl)
          WHEEL_PATH="${WHEELS[0]}"
          test -f "$WHEEL_PATH"
          VIDEOCAPTIONER_TEST_WHEEL="$WHEEL_PATH" \
            uv run pytest tests/test_packaging/test_fresh_install.py -q

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/

      - name: Upload wheel and source distribution to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes || \
              gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" dist/* --clobber
