name: Build Desktop Apps

on:
  pull_request:
    paths:
      - "videocaptioner/**"
      - "resource/**"
      - "scripts/build_desktop.py"
      - "scripts/build_windows_installer.py"
      - "scripts/smoke_desktop.py"
      - "packaging/windows/**"
      - "VideoCaptioner.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-desktop.yml"
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Intel
            os: macos-15-intel

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Build desktop bundle
        run: uv run --with pyinstaller --with static-ffmpeg python scripts/build_desktop.py --clean

      - name: Smoke test packaged app
        run: uv run python scripts/smoke_desktop.py dist/VideoCaptioner

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: uv run python scripts/build_windows_installer.py

      - name: Smoke test silent install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Invoke-CheckedProcess {
            param(
              [string]$Executable,
              [string[]]$ArgumentList,
              [string]$Description
            )

            $process = Start-Process -FilePath $Executable -ArgumentList $ArgumentList -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "$Description failed with exit code $($process.ExitCode)"
            }
          }

          $installer = Get-ChildItem artifacts -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows setup artifact was not created" }

          $installDir = Join-Path $env:RUNNER_TEMP "VideoCaptioner-installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
            "HKCU:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )

          function Get-VideoCaptionerUninstallEntries {
            param(
              [string[]]$Roots,
              [string]$InstallDir
            )

            $pathSeparators = [char[]]@(
              [System.IO.Path]::DirectorySeparatorChar,
              [System.IO.Path]::AltDirectorySeparatorChar
            )
            $normalizedInstallDir = [System.IO.Path]::GetFullPath($InstallDir).TrimEnd($pathSeparators)

            foreach ($root in $Roots) {
              if (-not (Test-Path -LiteralPath $root -ErrorAction Stop)) { continue }

              foreach ($key in (Get-ChildItem -LiteralPath $root -ErrorAction Stop)) {
                $entry = Get-ItemProperty -LiteralPath $key.PSPath -ErrorAction Stop
                # Windows may contain legitimate empty uninstall keys; -ErrorAction Stop still surfaces provider errors.
                if ($null -eq $entry) { continue }
                $displayNameMatches = $entry.DisplayName -eq "VideoCaptioner-Mod"
                if (-not $displayNameMatches) { continue }
                if ([string]::IsNullOrWhiteSpace([string]$entry.InstallLocation)) { continue }

                try {
                  $normalizedEntryInstallDir = [System.IO.Path]::GetFullPath(
                    [string]$entry.InstallLocation
                  ).TrimEnd($pathSeparators)
                } catch {
                  continue
                }

                if ([System.StringComparer]::OrdinalIgnoreCase.Equals(
                  $normalizedEntryInstallDir,
                  $normalizedInstallDir
                )) {
                  [PSCustomObject]@{
                    RegistryPath   = $key.PSPath
                    InstallLocation = $normalizedEntryInstallDir
                  }
                }
              }
            }
          }

          $installerArguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir")
          Invoke-CheckedProcess -Executable $installer.FullName -ArgumentList $installerArguments -Description "Installer"

          Invoke-CheckedProcess -Executable $installer.FullName -ArgumentList $installerArguments -Description "Installer upgrade/reinstall"

          $exe = Join-Path $installDir "VideoCaptioner.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found: $exe" }

          $postInstallMatches = @(Get-VideoCaptionerUninstallEntries -Roots $uninstallRoots -InstallDir $installDir)
          if ($postInstallMatches.Count -ne 1) {
            throw "Expected exactly one matching uninstall entry, found $($postInstallMatches.Count)"
          }
          Write-Host "Matched uninstall registry entry: $($postInstallMatches[0].RegistryPath)"

          $versionOutput = & $exe --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed --version check failed" }
          Write-Host $versionOutput

          $smokeOutput = uv run python scripts/smoke_desktop.py $installDir 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed package smoke failed" }
          Write-Host $smokeOutput

          $uninstaller = Join-Path -Path ($postInstallMatches[0].InstallLocation) -ChildPath "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          $uninstallerArguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          Invoke-CheckedProcess -Executable $uninstaller -ArgumentList $uninstallerArguments -Description "Uninstaller"
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $installDir); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $installDir) { throw "Install directory remains after uninstall: $installDir" }
          $remainingEntries = @(Get-VideoCaptionerUninstallEntries -Roots $uninstallRoots -InstallDir $installDir)
          if ($remainingEntries.Count -ne 0) {
            throw "Expected zero matching uninstall entries after uninstall, found $($remainingEntries.Count)"
          }

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: Upload desktop assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes || \
              gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" artifacts/* --clobber
