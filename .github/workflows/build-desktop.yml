name: Build Desktop Apps

on:
  pull_request:
    paths:
      - "videocaptioner/**"
      - "resource/**"
      - "scripts/build_desktop.py"
      - "scripts/build_windows_installer.py"
      - "scripts/smoke_desktop.py"
      - "packaging/windows/**"
      - "VideoCaptioner.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-desktop.yml"
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Intel
            os: macos-15-intel

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Build desktop bundle
        run: uv run --with pyinstaller --with static-ffmpeg python scripts/build_desktop.py --clean

      - name: Smoke test packaged app
        run: uv run python scripts/smoke_desktop.py dist/VideoCaptioner

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: uv run python scripts/build_windows_installer.py

      - name: Smoke test silent install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows setup artifact was not created" }

          $installDir = Join-Path $env:RUNNER_TEMP "VideoCaptioner-installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Installer failed with exit code $LASTEXITCODE" }

          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Installer upgrade/reinstall failed with exit code $LASTEXITCODE" }

          $exe = Join-Path $installDir "VideoCaptioner.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found: $exe" }

          $uninstallRoot = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $uninstallEntry = Get-ChildItem $uninstallRoot | Get-ItemProperty |
            Where-Object { $_.DisplayName -eq "VideoCaptioner-Mod" } | Select-Object -First 1
          if (-not $uninstallEntry) { throw "VideoCaptioner-Mod uninstall entry was not registered" }

          $versionOutput = & $exe --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed --version check failed" }
          Write-Host $versionOutput

          $smokeOutput = uv run python scripts/smoke_desktop.py $installDir 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed package smoke failed" }
          Write-Host $smokeOutput

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstaller failed with exit code $LASTEXITCODE" }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $installDir); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $installDir) { throw "Install directory remains after uninstall: $installDir" }
          $remainingEntry = Get-ChildItem $uninstallRoot | Get-ItemProperty |
            Where-Object { $_.DisplayName -eq "VideoCaptioner-Mod" } | Select-Object -First 1
          if ($remainingEntry) { throw "VideoCaptioner-Mod uninstall entry remains after uninstall" }

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes || \
              gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" artifacts/* --clobber
